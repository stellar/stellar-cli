name: Docs validation

on:
  push:
    branches: [main, release/**]
  pull_request:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha ||
    github.ref }}
  cancel-in-progress: true

jobs:
  docs-validation:
    uses: stellar/stellar-docs/.github/workflows/cli-build.yml@ci/stellar-cli-reusable-check
    with:
      stellar-cli-ref: ${{ github.sha }}
      stellar-docs-ref: ci/stellar-cli-reusable-check
