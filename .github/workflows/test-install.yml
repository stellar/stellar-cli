name: Test Install

on:
  push:
    branches: [main, release/**]
    paths:
      - install.sh
      - test_install.rb
  pull_request:
    paths:
      - install.sh
      - test_install.rb

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha ||
    github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby
      - name: Run install tests
        run: ruby test_install.rb
