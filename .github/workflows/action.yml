---
name: Action

on:
  pull_request:

permissions: {}

env:
  STELLAR_CLI_VERSION: v26.1.0

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha ||
    github.ref }}-{{ github.event_name	}}
  cancel-in-progress: true

jobs:
  bash:
    strategy:
      matrix:
        image: [macos-15, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: ${{ env.STELLAR_CLI_VERSION }}
      - shell: bash
        run: |
          stellar --version
          stellar contract id asset --asset native --network testnet

  # Check the CLI is on PATH for shells other than bash, which resolve PATH
  # natively and, on Windows, cannot use the MSYS form.
  pwsh:
    strategy:
      matrix:
        image: [macos-15, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: ${{ env.STELLAR_CLI_VERSION }}
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          stellar --version
          stellar contract id asset --asset native --network testnet

  # Check the CLI is found by tools that start processes without a shell, such
  # as GNU make, which on Windows uses the Win32 API and cannot resolve an MSYS
  # style path on PATH.
  make:
    strategy:
      matrix:
        image: [macos-15, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: ${{ env.STELLAR_CLI_VERSION }}
      - shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          printf 'check:\n\tstellar --version\n\tstellar contract id asset --asset native --network testnet\n' > Makefile
          make check
