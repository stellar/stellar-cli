---
name: Action

on:
  pull_request:

concurrency:
  group:
    ${{ github.workflow }}-${{ github.ref_protected == 'true' && github.sha ||
    github.ref }}-{{ github.event_name	}}
  cancel-in-progress: true

jobs:
  action:
    strategy:
      matrix:
        image: [macos-15, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          version: v26.1.0
      - shell: bash
        run: |
          stellar --version
          stellar contract id asset --asset native --network testnet
      # Check the CLI is found by tools that start processes without a shell,
      # such as GNU make, which on Windows uses the Win32 API and cannot
      # resolve an MSYS style path on PATH.
      - shell: bash
        run: |
          cd "$RUNNER_TEMP"
          printf 'check:\n\tstellar --version\n\tstellar contract id asset --asset native --network testnet\n' > Makefile
          make check
