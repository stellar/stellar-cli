[workspace]
resolver = "2"
members = [
    "cmd/stellar-cli",
    "cmd/soroban-cli",
    "cmd/doc-gen",
    "cmd/crates/*",
    "cmd/crates/soroban-test/tests/fixtures/test-wasms/*",
    "cmd/crates/soroban-test/tests/fixtures/hello",
    "cmd/crates/soroban-test/tests/fixtures/bye",
]
default-members = [
    "cmd/soroban-cli",
    "cmd/crates/soroban-spec-tools",
    "cmd/crates/soroban-test",
]
exclude = [
    "cmd/crates/soroban-test/tests/fixtures/hello",
    "cmd/crates/soroban-test/tests/fixtures/bye",
    "cmd/crates/soroban-test/tests/fixtures/eth_abi",
]

[workspace.package]
version = "28.0.0"
rust-version = "1.93.0"

# Dependencies located in this repo:
[workspace.dependencies.soroban-cli]
version = "=28.0.0"
path = "cmd/soroban-cli"
default-features = false

[workspace.dependencies.soroban-spec-typescript]
version = "28.0.0"
path = "./cmd/crates/soroban-spec-typescript"

[workspace.dependencies.soroban-spec-tools]
version = "28.0.0"
path = "./cmd/crates/soroban-spec-tools"

[workspace.dependencies.stellar-ledger]
version = "=28.0.0"
path = "cmd/crates/stellar-ledger"

# Dependencies from the rs-stellar-xdr repo:
[workspace.dependencies.stellar-xdr]
version = "28.0.0"

# Dependencies from the rs-stellar-env repo:
[workspace.dependencies.soroban-env-host]
version = "28.0.0-rc.1"

# Dependencies from the rs-soroban-sdk repo:
[workspace.dependencies.soroban-spec]
version = "28.0.0-rc.1"

[workspace.dependencies.soroban-spec-rust]
version = "28.0.0-rc.1"

[workspace.dependencies.soroban-sdk]
version = "28.0.0-rc.1"

[workspace.dependencies.soroban-token-sdk]
version = "28.0.0-rc.1"

[workspace.dependencies.stellar-asset-spec]
version = "28.0.0-rc.1"

[workspace.dependencies.soroban-ledger-snapshot]
version = "28.0.0-rc.1"

# Dependencies from the rs-stellar-rpc-client repo:
[workspace.dependencies.soroban-rpc]
package = "stellar-rpc-client"
version = "28.0.0-rc.1"

# Dependencies from elsewhere shared by crates:
[workspace.dependencies]
stellar-strkey = "0.0.16"
sep5 = "0.1.0"
base64 = "0.21.2"
thiserror = "1.0.46"
sha2 = "0.10.7"
ethnum = "1.3.2"
escape-bytes = "0.1.1"
hex = "0.4.3"
itertools = "0.10.0"
async-trait = "0.1.76"
serde-aux = "4.1.2"
serde_json = "1.0.82"
serde = "1.0.82"
clap = { version = "4.1.8", features = [
    "derive",
    "env",
    "deprecated",
    "string",
] }
clap_complete = "4.1.4"
tracing = "0.1.37"
tracing-subscriber = "0.3.20"
tracing-appender = "0.2.3"
which = "4.4.0"
wasmparser = "0.116.1"
directories = "5.0.1"
ulid = "1.1"
termcolor = "1.1.3"
termcolor_output = "1.0.1"
ed25519-dalek = ">= 2.1.1"
http = "1.0.0"
walkdir = "2.5.0"
path-slash = "0.2.1"
toml_edit = "0.22.20"
toml = "0.8.19"
reqwest = { version = "0.12.7", default-features = false, features = ["rustls-tls"] }
# Dependabot security fixes (transitive dependencies)
time = ">=0.3.47"
bytes = ">=1.11.1"
# testing
predicates = "3.1.2"
testcontainers = "0.27.2"
httpmock = "0.7.0"
astral-tokio-tar = "0.6.0"

[patch.crates-io]
# Pending https://github.com/stellar/rs-stellar-xdr/pull/566, which widens the
# user-defined type name limit so that a fully qualified type name fits. Pinned
# to the same rev rs-soroban-sdk#1970 uses so the graph has one stellar-xdr.
stellar-xdr = { git = "https://github.com/stellar/rs-stellar-xdr", rev = "82677e1dfe49b6b94fc6440d9c58be74d2a33bff" }
# Pending https://github.com/stellar/rs-soroban-sdk/pull/1970, which names
# user-defined types in contract specs by their fully qualified path, and the
# PR stacked on it, which stops marking types for spec shaking and shakes them
# by reachability instead.
soroban-spec = { git = "https://github.com/stellar/rs-soroban-sdk", rev = "e22cfbb87fa9f2e7a2e067713f8be91170265912" }
soroban-spec-rust = { git = "https://github.com/stellar/rs-soroban-sdk", rev = "e22cfbb87fa9f2e7a2e067713f8be91170265912" }
soroban-sdk = { git = "https://github.com/stellar/rs-soroban-sdk", rev = "e22cfbb87fa9f2e7a2e067713f8be91170265912" }
soroban-token-sdk = { git = "https://github.com/stellar/rs-soroban-sdk", rev = "e22cfbb87fa9f2e7a2e067713f8be91170265912" }
stellar-asset-spec = { git = "https://github.com/stellar/rs-soroban-sdk", rev = "e22cfbb87fa9f2e7a2e067713f8be91170265912" }
soroban-ledger-snapshot = { git = "https://github.com/stellar/rs-soroban-sdk", rev = "e22cfbb87fa9f2e7a2e067713f8be91170265912" }

[profile.release]
overflow-checks = true

[profile.test-wasms]
inherits = "release"
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = true
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-panic-unwind]
inherits = "release"
panic = "unwind"
